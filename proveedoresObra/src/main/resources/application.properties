spring.application.name=proveedoresObra
server.port=8082

# CONEXION A MYSQL
# Crea la BD vacia en phpMyAdmin antes de arrancar
# Hibernate generará las tablas desde las entidades
spring.datasource.url=jdbc:mysql://localhost:3306/db_proveedores_obra
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL AUTO
# create-drop: elimina y recrea las tablas cada vez que arranca
# update: crea las tablas si no existen, las actualiza si cambian
spring.jpa.hibernate.ddl-auto=create-drop

# MOSTRAR SQL EN CONSOLA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
