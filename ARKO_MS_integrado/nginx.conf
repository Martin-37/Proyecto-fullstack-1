events {}

http {
    # Reenvia el Host y la IP real a cada microservicio.
    # El header Authorization (token JWT) nginx lo reenvia por defecto.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    server {
        listen 80;

        # ---- Servicios con ruta /api/... unica: van directos ----
        location /api/usuarios     { proxy_pass http://usuarios:8080; }
        location /api/documentos   { proxy_pass http://documentos:8081; }
        location /api/trabajadores { proxy_pass http://personal:8082; }
        location /api/tickets      { proxy_pass http://tickets:8083; }
        location /api/comentarios  { proxy_pass http://comentarios:8084; }
        location /asistencia       { proxy_pass http://asistencia:8085; }
        location /api/maquinaria   { proxy_pass http://maquinariapesada:8087; }
        location /api/obras        { proxy_pass http://obra:8088; }
        location /api/proveedores  { proxy_pass http://provedoresobra:8090; }
        location /api/auth         { proxy_pass http://provedoresobra:8090; }

        location /api/presupuestos { proxy_pass http://presupuesto:8089; }
        location /api/finanzas     { proxy_pass http://finanza:8086; }
    }
}
