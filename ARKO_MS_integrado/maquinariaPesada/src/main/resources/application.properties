spring.application.name=maquinariaPesada
server.port=8085

# Desactiva la búsqueda automática de un archivo compose.yaml al arrancar
spring.docker.compose.enabled=false


spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_maquinaria_pesada
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Desactivado por defecto: no hay servidor Eureka en este docker-compose.
# Si luego agregan un Eureka Server, pongan EUREKA_ENABLED=true como variable de entorno.
eureka.client.enabled=${EUREKA_ENABLED:false}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
