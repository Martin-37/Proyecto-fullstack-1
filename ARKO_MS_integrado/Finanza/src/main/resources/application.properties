spring.application.name=finanza
server.port=8082

# Conexion a MySQL de XAMPP + configuracion Hibernate
# CONEXION A MYSQL
# Crea la BD vacia en phpMyAdmin antes de arrancar.
# Hibernate generara las tablas desde las entidades.
spring.datasource.url=jdbc:mysql://localhost:3306/db_arkoms
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL AUTO
# create-drop: borra y recrea todas las tablas en cada arranque.
# Garantiza que la tabla "finanza" se cree limpia y el DataInitializer siempre cargue datos.
# Cambiar a "update" solo cuando la BD ya este estable y no se quieran perder datos.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger OpenAPI
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html