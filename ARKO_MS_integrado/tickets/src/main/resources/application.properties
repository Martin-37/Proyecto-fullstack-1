spring.application.name=tickets-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/db_tickets
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# Conexion al microservicio de documentos
documentos.url=http://localhost:8085

# JWT (mismo secreto que usuarios_v2)
jwt.secret=tu-clave-secreta-muy-larga-minimo-32-caracteres-para-seguridad
jwt.expiration=86400000

