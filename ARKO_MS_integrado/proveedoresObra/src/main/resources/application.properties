spring.application.name=proveedoresObra
server.port=8086

# Permite que beans con el mismo nombre se sobrescriban en vez de fallar
# (evita el error BeanDefinitionOverrideException por classpath duplicado/cache de build)
spring.main.allow-bean-definition-overriding=true

# Desactiva la busqueda automatica de un archivo compose.yaml al arrancar
spring.docker.compose.enabled=false

# CONEXION A MYSQL
# Crea la BD vacia en phpMyAdmin antes de arrancar
# Hibernate generará las tablas desde las entidades
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_proveedores_obra
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL AUTO
# create-drop: elimina y recrea las tablas cada vez que arranca
# update: crea las tablas si no existen, las actualiza si cambian
spring.jpa.hibernate.ddl-auto=create-drop

# MOSTRAR SQL EN CONSOLA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
# secret en base64, usado para firmar/validar los tokens (HS256)
jwt.secret=mIEAUkqALaLhVdC4PO+EDthP5qQAJWFD7SJFqwh0YQE=
jwt.expiration-ms=3600000

# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
