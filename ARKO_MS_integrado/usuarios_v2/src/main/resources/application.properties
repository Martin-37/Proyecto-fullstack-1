spring.application.name=usuarios
server.port=8088

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_usuarios
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=tu-clave-secreta-muy-larga-minimo-32-caracteres-para-seguridad
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.cl.dsy1103.usuarios=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/usuarios.log
logging.file.max-size=10MB
logging.file.max-history=10

# Configuracion Swagger / OpenAPI
springdoc.packages-to-scan=cl.dsy1103.usuarios.controller
springdoc.paths-to-match=/api/usuarios/**,/api/roles/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true