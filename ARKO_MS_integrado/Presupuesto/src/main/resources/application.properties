spring.application.name=presupuesto
server.port=8082

# Conexion a MySQL de XAMPP + configuracion Hibernate
# CONEXION A MYSQL
# Crea la BD vacia en phpMyAdmin antes de arrancar.
# Hibernate generara las tablas desde las entidades.
spring.datasource.url=jdbc:mysql://localhost:3306/db_arkoms
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL AUTO
# update: crea las tablas si no existen, las actualiza si el modelo cambio.
# Ideal para desarrollo en clase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Swagger OpenAPI
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html      