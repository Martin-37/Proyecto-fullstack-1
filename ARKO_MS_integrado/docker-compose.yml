services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuarios:
    build: ./usuarios_v2
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_arko
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      JWT_SECRET: tu-clave-secreta-muy-larga-minimo-32-caracteres-para-seguridad
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      mysql: { condition: service_healthy }
    restart: unless-stopped

  documentos:
    build: ./documentos
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_arko
